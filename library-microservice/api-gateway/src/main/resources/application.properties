server.port=8080
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=security-service-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://security-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

spring.cloud.gateway.server.webmvc.routes[1].id=security-service-users
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://security-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

spring.cloud.gateway.server.webmvc.routes[2].id=book-service-books
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://book-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/books/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

spring.cloud.gateway.server.webmvc.routes[3].id=book-service-viewed
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://book-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/viewed-books/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

spring.cloud.gateway.server.webmvc.routes[4].id=borrowing-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://borrowing-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/borrowings/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# CORS origin/methods/headers are handled by the CorsFilter bean in
# config/CorsConfig.java instead of properties - see that class for why.
#
# The DedupeResponseHeader filter on each route above strips duplicate
# Access-Control-Allow-* header values. Spring's own docs call this out as a
# known scenario: both the gateway's CORS logic and downstream response
# handling can each add a copy of these headers, and browsers reject a
# response that has the same header twice - even with identical values -
# because CORS requires exactly one value. This filter keeps just one.

spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true